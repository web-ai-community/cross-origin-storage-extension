#
# Builds the Safari app on a GitHub-hosted Mac, uploads it to App Store
# Connect, and submits it for review. `npm run release:safari` starts this
# workflow and follows it; `npm run release:safari -- --local` does the same
# on your own Mac. The runner image comes with iOS Simulator runtimes, which
# the iOS archive step needs for asset catalog compilation.
#
# Needs the repository secret ASC_API_KEY: the contents of the App Store
# Connect API key file (AuthKey_<KEY_ID>.p8). The key ID, issuer ID, and team
# ID default to this project's values in the scripts.

name: Release Safari app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        type: choice
        options: [ios, macos, both]
        default: ios
      release_notes:
        description: What's New text
        type: string
        required: true
      marketing_version:
        description: App Store version, e.g. 2.3 (empty picks it from App Store Connect)
        type: string
        required: false
      build_number:
        description: Build number (empty picks one higher than any uploaded)
        type: string
        required: false
      cancel_review:
        description: Take the version now in review out of review first
        type: boolean
        default: false
      regenerate:
        description: Rebuild the Xcode wrapper project first (not committed back)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    # Xcode 27, which the committed Xcode project needs.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          PLATFORM: ${{ inputs.platform }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CANCEL_REVIEW: ${{ inputs.cancel_review }}
          REGENERATE: ${{ inputs.regenerate }}
        run: |
          xcodebuild -version
          # --local: build on this runner instead of starting this workflow.
          args=(safari --local --platform "$PLATFORM" --release-notes "$RELEASE_NOTES")
          [ -n "$MARKETING_VERSION" ] && args+=(--marketing-version "$MARKETING_VERSION")
          [ -n "$BUILD_NUMBER" ] && args+=(--build-number "$BUILD_NUMBER")
          [ "$CANCEL_REVIEW" = true ] && args+=(--cancel-review)
          [ "$REGENERATE" = true ] && args+=(--regenerate)
          node publish-extension.mjs "${args[@]}"
